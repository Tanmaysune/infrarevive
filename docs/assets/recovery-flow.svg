<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="InfraRevive automatic recovery pipeline: node failure detected by Prometheus, Alertmanager webhook to Jenkins, Terraform destroy and apply, Ansible configuration, node rejoins the cluster in under five minutes">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .t   { font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .m   { font-family:'Consolas','SF Mono','DejaVu Sans Mono',monospace; }
      .ttl { font-size:15px; font-weight:700; }
      .dsc { font-size:11px; }
      .tag { font-size:10.5px; letter-spacing:.6px; }
      .hd  { font-size:13px; font-weight:700; letter-spacing:3.6px; }

      .stage { opacity:.28; }
      .s1 { animation: a1 12s linear infinite; }
      .s2 { animation: a2 12s linear infinite; }
      .s3 { animation: a3 12s linear infinite; }
      .s4 { animation: a4 12s linear infinite; }
      .s5 { animation: a5 12s linear infinite; }
      .s6 { animation: a6 12s linear infinite; }
      .s7 { animation: a7 12s linear infinite; }
      .s8 { animation: a8 12s linear infinite; }
      @keyframes a1 { 0%,5%{opacity:.28} 8%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a2 { 0%,14%{opacity:.28} 17%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a3 { 0%,23%{opacity:.28} 26%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a4 { 0%,32%{opacity:.28} 35%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a5 { 0%,45%{opacity:.28} 48%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a6 { 0%,55%{opacity:.28} 58%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a7 { 0%,65%{opacity:.28} 68%,95%{opacity:1} 100%{opacity:.28} }
      @keyframes a8 { 0%,76%{opacity:.28} 79%,95%{opacity:1} 100%{opacity:.28} }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg2)"/>
  <text class="t hd" x="40" y="42" fill="#5C6B88">AUTOMATIC RECOVERY PIPELINE</text>
  <text class="m tag" x="1160" y="42" text-anchor="end" fill="#475569">no human in the loop</text>

  <!-- flow track -->
  <path id="flow" d="M150,158 H1050 V262 H150 V400 H1050"
        fill="none" stroke="url(#track)" stroke-opacity="0.30" stroke-width="2.5" stroke-linecap="round"/>

  <!-- travelling signal -->
  <g filter="url(#glow2)">
    <circle r="6" fill="#A5B4FC">
      <animate attributeName="fill" values="#F87171;#F87171;#818CF8;#34D399;#34D399" keyTimes="0;0.2;0.5;0.85;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.06;0.82;1">
        <mpath href="#flow" xlink:href="#flow"/>
      </animateMotion>
    </circle>
  </g>

  <!-- ============ ROW 1 ============ -->
  <g class="stage s1">
    <rect x="40" y="110" width="220" height="96" rx="14" fill="#101827" stroke="#DC2626" stroke-opacity=".45"/>
    <g transform="translate(60,130)" stroke="#F87171" fill="none" stroke-width="1.7" stroke-linecap="round">
      <rect x="0" y="0" width="16" height="6" rx="1.5"/><rect x="0" y="9" width="16" height="6" rx="1.5"/>
      <line x1="20" y1="1" x2="26" y2="14"/><line x1="26" y1="1" x2="20" y2="14"/>
    </g>
    <text class="t ttl" x="96" y="142" fill="#FCA5A5">Worker node dies</text>
    <text class="m dsc" x="60" y="168" fill="#94A3B8">kubelet + node-exporter</text>
    <text class="m dsc" x="60" y="183" fill="#94A3B8">stop responding</text>
    <text class="m tag" x="240" y="199" text-anchor="end" fill="#64748B">T+0s</text>
  </g>

  <g class="stage s2">
    <rect x="340" y="110" width="220" height="96" rx="14" fill="#101827" stroke="#D97706" stroke-opacity=".45"/>
    <g transform="translate(360,130)" stroke="#FBBF24" fill="none" stroke-width="1.7" stroke-linecap="round">
      <polyline points="0,14 5,6 10,10 16,0"/><line x1="0" y1="16" x2="18" y2="16"/>
    </g>
    <text class="t ttl" x="396" y="142" fill="#FCD34D">Prometheus fires</text>
    <text class="m dsc" x="360" y="168" fill="#94A3B8">up{job="node-exporter"}</text>
    <text class="m dsc" x="360" y="183" fill="#94A3B8">== 0  for: 30s</text>
    <text class="m tag" x="540" y="199" text-anchor="end" fill="#64748B">T+30s</text>
  </g>

  <g class="stage s3">
    <rect x="640" y="110" width="220" height="96" rx="14" fill="#101827" stroke="#D97706" stroke-opacity=".45"/>
    <g transform="translate(660,129)" stroke="#FBBF24" fill="none" stroke-width="1.7" stroke-linecap="round">
      <path d="M2 12 a7 7 0 0 1 14 0 v3 h2 H0 h2 z"/><path d="M7 18 h4"/>
    </g>
    <text class="t ttl" x="696" y="142" fill="#FCD34D">Alertmanager</text>
    <text class="m dsc" x="660" y="168" fill="#94A3B8">POST /generic-webhook</text>
    <text class="m dsc" x="660" y="183" fill="#94A3B8">NodeDown &#8594; Jenkins</text>
    <text class="m tag" x="840" y="199" text-anchor="end" fill="#64748B">T+31s</text>
  </g>

  <g class="stage s4">
    <rect x="940" y="110" width="220" height="96" rx="14" fill="#101827" stroke="#4F46E5" stroke-opacity=".5"/>
    <g transform="translate(960,129)" stroke="#A5B4FC" fill="none" stroke-width="1.7" stroke-linecap="round">
      <circle cx="4" cy="4" r="3"/><circle cx="4" cy="16" r="3"/><circle cx="16" cy="10" r="3"/>
      <path d="M7 5 L13 9 M7 15 L13 11"/>
    </g>
    <text class="t ttl" x="996" y="142" fill="#C7D2FE">Recovery pipeline</text>
    <text class="m dsc" x="960" y="168" fill="#94A3B8">Jenkins locates the dead</text>
    <text class="m dsc" x="960" y="183" fill="#94A3B8">node by private IP</text>
    <text class="m tag" x="1140" y="199" text-anchor="end" fill="#64748B">T+35s</text>
  </g>

  <!-- ============ ROW 2 ============ -->
  <g class="stage s5">
    <rect x="40" y="352" width="220" height="96" rx="14" fill="#101827" stroke="#7C3AED" stroke-opacity=".5"/>
    <g transform="translate(60,371)" stroke="#C4B5FD" fill="none" stroke-width="1.7" stroke-linecap="round">
      <path d="M1 4 h16 M6 4 V2 h6 v2 M3 4 l1.5 14 h9 L18 4"/>
    </g>
    <text class="t ttl" x="96" y="384" fill="#DDD6FE">Terraform destroy</text>
    <text class="m dsc" x="60" y="410" fill="#94A3B8">-target=workers[N] only</text>
    <text class="m dsc" x="60" y="425" fill="#94A3B8">healthy nodes untouched</text>
    <text class="m tag" x="240" y="441" text-anchor="end" fill="#64748B">T+95s</text>
  </g>

  <g class="stage s6">
    <rect x="340" y="352" width="220" height="96" rx="14" fill="#101827" stroke="#7C3AED" stroke-opacity=".5"/>
    <g transform="translate(360,371)" stroke="#C4B5FD" fill="none" stroke-width="1.7" stroke-linecap="round">
      <rect x="1" y="3" width="17" height="14" rx="2"/><path d="M9.5 7 v6 M6.5 10 h6"/>
    </g>
    <text class="t ttl" x="396" y="384" fill="#DDD6FE">Terraform apply</text>
    <text class="m dsc" x="360" y="410" fill="#94A3B8">fresh EC2 provisioned,</text>
    <text class="m dsc" x="360" y="425" fill="#94A3B8">pipeline waits for SSH</text>
    <text class="m tag" x="540" y="441" text-anchor="end" fill="#64748B">T+170s</text>
  </g>

  <g class="stage s7">
    <rect x="640" y="352" width="220" height="96" rx="14" fill="#101827" stroke="#0891B2" stroke-opacity=".5"/>
    <g transform="translate(660,371)" stroke="#67E8F9" fill="none" stroke-width="1.7" stroke-linecap="round">
      <path d="M13 2 a5 5 0 0 0-6 7 L2 14 l3 3 5-5 a5 5 0 0 0 7-6 l-3 3 -3-1 -1-3z"/>
    </g>
    <text class="t ttl" x="696" y="384" fill="#A5F3FC">Ansible configures</text>
    <text class="m dsc" x="660" y="410" fill="#94A3B8">containerd, kubeadm,</text>
    <text class="m dsc" x="660" y="425" fill="#94A3B8">kubelet, node-exporter</text>
    <text class="m tag" x="840" y="441" text-anchor="end" fill="#64748B">T+260s</text>
  </g>

  <g class="stage s8">
    <rect x="940" y="352" width="220" height="96" rx="14" fill="#0E1A20" stroke="#10B981" stroke-opacity=".6"/>
    <g transform="translate(960,371)" stroke="#6EE7B7" fill="none" stroke-width="2.1" stroke-linecap="round">
      <polyline points="0,10 6,16 18,3"/>
    </g>
    <text class="t ttl" x="996" y="384" fill="#6EE7B7">Node Ready</text>
    <text class="m dsc" x="960" y="410" fill="#94A3B8">kubeadm join, pods</text>
    <text class="m dsc" x="960" y="425" fill="#94A3B8">rescheduled, app live</text>
    <text class="m tag" x="1140" y="441" text-anchor="end" fill="#34D399">T+4m50s</text>
    <circle cx="1150" cy="366" r="5" fill="#34D399">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer -->
  <text class="m tag" x="600" y="492" text-anchor="middle" fill="#475569">
    detection 30s  &#183;  teardown 60s  &#183;  provision 75s  &#183;  configure 90s  &#183;  join 30s
  </text>
</svg>
