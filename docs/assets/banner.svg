<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="InfraRevive - Dead Server Recovery System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="45%" stop-color="#0D1426"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="35%"  stop-color="#A5B4FC"/>
      <stop offset="65%"  stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="40%" r="52%">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#4F46E5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#8FA3C8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <mask id="sheenMask">
      <rect x="-1200" y="0" width="1200" height="372" fill="url(#sheen)">
        <animate attributeName="x" values="-1200;1200" dur="6s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <style>
      .wm {
        font-family: 'Century Gothic','Futura','Avenir Next','Trebuchet MS','Segoe UI',sans-serif;
        font-size: 82px; letter-spacing: 4px; font-weight: 400;
      }
      .sub {
        font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
        font-size: 17px; letter-spacing: 6.2px; font-weight: 600;
      }
      .desc {
        font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
        font-size: 13px; letter-spacing: 1.6px; font-weight: 400;
      }
      .chip {
        font-family: 'Consolas','SF Mono','DejaVu Sans Mono',monospace;
        font-size: 12.5px; letter-spacing: 1.4px;
      }
      .fade-a { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) both; }
      .fade-b { animation: rise 1.1s .28s cubic-bezier(.2,.7,.3,1) both; }
      .fade-c { animation: rise 1.1s .52s cubic-bezier(.2,.7,.3,1) both; }
      .fade-d { animation: rise 1.1s .72s cubic-bezier(.2,.7,.3,1) both; }
      @keyframes rise { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
      .drift { animation: drift 26s linear infinite; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-44px,-44px); } }
      .draw { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 1.5s .55s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="372" fill="url(#bg)"/>
  <g class="drift"><rect x="-60" y="-60" width="1320" height="492" fill="url(#grid)"/></g>
  <rect width="1200" height="372" fill="url(#halo)"/>

  <!-- horizon glow -->
  <ellipse cx="600" cy="384" rx="420" ry="46" fill="#4F46E5" opacity="0.30" filter="url(#soft)">
    <animate attributeName="opacity" values="0.18;0.38;0.18" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- mark -->
  <g class="fade-a" transform="translate(600,92)">
    <circle r="27" fill="none" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1.4">
      <animate attributeName="r" values="24;38;24" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="19" fill="#4F46E5" fill-opacity="0.14" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M2 -11 L-7 2 L0 2 L-2 12 L7 -1 L0 -1 Z" fill="#A5B4FC"/>
  </g>

  <!-- wordmark -->
  <g class="fade-b">
    <text class="wm" x="602" y="196" text-anchor="middle" fill="url(#wordmark)">InfraRevive</text>
    <text class="wm" x="602" y="196" text-anchor="middle" fill="#FFFFFF" mask="url(#sheenMask)">InfraRevive</text>
  </g>

  <path class="draw" d="M240 220 H960" stroke="url(#rule)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text class="sub fade-c" x="603" y="254" text-anchor="middle" fill="#94A3B8">DEAD SERVER RECOVERY SYSTEM</text>
  <text class="desc fade-d" x="601" y="280" text-anchor="middle" fill="#5C6B88">Autonomous Kubernetes node recovery on AWS</text>

  <!-- status chips -->
  <g class="fade-d">
    <g transform="translate(352,312)">
      <rect x="0" y="0" width="184" height="30" rx="15" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.32"/>
      <circle cx="18" cy="15" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text class="chip" x="32" y="19.5" fill="#6EE7B7">RECOVERY ENGINE LIVE</text>
    </g>
    <g transform="translate(552,312)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#4F46E5" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.32"/>
      <text class="chip" x="75" y="19.5" text-anchor="middle" fill="#A5B4FC">MTTR &lt; 5 MIN</text>
    </g>
    <g transform="translate(718,312)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#0891B2" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.30"/>
      <text class="chip" x="65" y="19.5" text-anchor="middle" fill="#67E8F9">ZERO TOUCH</text>
    </g>
  </g>
</svg>
