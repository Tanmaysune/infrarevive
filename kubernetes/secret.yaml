# Secret — sensitive credentials (base64-encoded)
# NOTE: For production, use a sealed-secret or external secrets operator
# instead of plain base64. This is base64 (not encryption) — anyone with
# cluster access can decode it. Replace the value before deploying.
#
#   echo -n 'rootpassword' | base64   ->   cm9vdHBhc3N3b3Jk
#
apiVersion: v1
kind: Secret
metadata:
  name: infrarevive-secrets
  namespace: infrarevive
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk          # rootpassword
  DB_PASS: cm9vdHBhc3N3b3Jk                        # rootpassword
