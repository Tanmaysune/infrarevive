# Ingress — routes external HTTP traffic to the correct service.
# Requires an Ingress controller (e.g. nginx-ingress) installed in the
# cluster. If no Ingress controller is present, the NodePort services
# (frontend-service:30080, flask-api-service:30500) still work directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrarevive-ingress
  namespace: infrarevive
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Frontend (student result portal) served at /
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          # Flask API served at /api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flask-api-service
                port:
                  number: 5000
