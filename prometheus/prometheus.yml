global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - "alert.rules.yml"
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '3.236.194.83:9100'
          - '32.196.230.40:9100'
          - '32.197.51.116:9100'
          - '44.213.103.49:9100'
  - job_name: 'flask-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['32.196.230.40:30500']
