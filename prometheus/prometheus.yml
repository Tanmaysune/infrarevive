global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - "alert.rules.yml"
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '172.20.5.142:9100'
          - '172.20.5.95:9100'
          - '172.20.5.166:9100'
          - '172.20.5.37:9100'
  - job_name: 'flask-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.20.5.95:30500']
