groups:
  - name: node_alerts
    interval: 5s
    rules:

      # --------------------------------------------------------
      # NODE DOWN / INSTANCE DOWN
      # Fires when a node-exporter target stops responding.
      # This is what triggers the recovery pipeline via the
      # Alertmanager -> Jenkins webhook.
      # --------------------------------------------------------
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node is DOWN"
          description: "Node {{ $labels.instance }} has been unreachable for more than 15 seconds. Recovery pipeline will be triggered."

      - alert: InstanceDown
        expr: up{job="node-exporter"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape node-exporter on {{ $labels.instance }}."

      # --------------------------------------------------------
      # HIGH CPU
      # --------------------------------------------------------
      - alert: NodeHighCPU
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage above 85% for 2 minutes on {{ $labels.instance }}."

      # --------------------------------------------------------
      # HIGH RAM / LOW MEMORY
      # --------------------------------------------------------
      - alert: NodeHighMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory below 10% on {{ $labels.instance }}."

      # --------------------------------------------------------
      # DISK FULL
      # Fires when root filesystem usage exceeds 85%.
      # Excludes tmpfs/overlay/docker overlay filesystems.
      # --------------------------------------------------------
      - alert: DiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk almost full on {{ $labels.instance }}"
          description: "Root filesystem usage above 85% on {{ $labels.instance }} (mountpoint /)."

      # --------------------------------------------------------
      # NODE NOT READY (via network reachability)
      # Without kube-state-metrics this approximates K8s node
      # readiness: if node-exporter is up but the node has been
      # unreachable for a short window, flag it as not-ready.
      # The primary recovery trigger remains NodeDown (critical).
      # --------------------------------------------------------
      - alert: NodeNotReady
        expr: up{job="node-exporter"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node NotReady"
          description: "Node {{ $labels.instance }} is not responding. Kubernetes will mark it NotReady. Recovery in progress."
