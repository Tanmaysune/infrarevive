groups:
  - name: node_alerts
    interval: 15s
    rules:

      # --------------------------------------------------------
      # NODE DOWN — PRIMARY RECOVERY TRIGGER
      # This is the ONLY alert that should call the Jenkins webhook.
      # for: 60s means the node must be unreachable for a full
      # minute before this fires. This prevents boot-time false
      # alerts — node-exporter takes 30-45s to start after EC2 boot.
      # --------------------------------------------------------
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node is DOWN"
          description: "Node {{ $labels.instance }} has been unreachable for more than 60 seconds. Recovery pipeline will be triggered."

      # --------------------------------------------------------
      # INSTANCE DOWN — informational only, inhibited by NodeDown
      # Alertmanager inhibit_rules suppress this whenever NodeDown
      # fires for the same instance. Does NOT trigger Jenkins webhook.
      # --------------------------------------------------------
      - alert: InstanceDown
        expr: up{job="node-exporter"} == 0
        for: 90s
        labels:
          severity: warning
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape node-exporter on {{ $labels.instance }}."

      # --------------------------------------------------------
      # NODE NOT READY — informational only, inhibited by NodeDown
      # Does NOT trigger Jenkins webhook.
      # --------------------------------------------------------
      - alert: NodeNotReady
        expr: up{job="node-exporter"} == 0
        for: 90s
        labels:
          severity: warning
        annotations:
          summary: "Kubernetes node NotReady"
          description: "Node {{ $labels.instance }} is not responding. Kubernetes will mark it NotReady."

      # --------------------------------------------------------
      # HIGH CPU
      # --------------------------------------------------------
      - alert: NodeHighCPU
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage above 85% for 2 minutes on {{ $labels.instance }}."

      # --------------------------------------------------------
      # HIGH RAM / LOW MEMORY
      # --------------------------------------------------------
      - alert: NodeHighMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory below 10% on {{ $labels.instance }}."

      # --------------------------------------------------------
      # DISK FULL
      # --------------------------------------------------------
      - alert: DiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk almost full on {{ $labels.instance }}"
          description: "Root filesystem usage above 85% on {{ $labels.instance }} (mountpoint /)."
